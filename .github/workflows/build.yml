name: Build TS0046 Custom Firmware

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies and Telink TC32 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y make python3 wget bzip2
          HOST="shyboy.oss-cn-shenzhen"
          FILE="readonly/tc32_gcc_v2.0.tar.bz2"
          wget -q "https://${HOST}://{FILE}"
          sudo tar -xjf tc32_gcc_v2.0.tar.bz2 -C /opt/

      - name: Compile Model 6 firmware
        run: |
          make clean
          make PROJECT_MODEL=_model_6 DEBUG="-DUART_PRINTF_MODE=OFF"

      - name: Upload compiled firmware
        uses: actions/upload-artifact@v4
        with:
          name: ts0046-ihseno-6key-v04
          path: |
            bin/*.bin
            bin/*.zigbee
